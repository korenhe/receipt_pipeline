[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
duckdb = { version = "0.10", features = ["bundled"] }

reqwest = { version = "0.13", features = ["json", "rustls-native-certs"] }
tokio = { version = "1", features = ["full"] }

# 🔑 critical fix
chrono = "=0.4.31"
